<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join with me!</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            width: 380px; /* 드롭다운 3개가 나란히 들어가도록 폭을 아주 조금 늘렸어 */
            min-height: 220px;
            box-sizing: border-box;
            z-index: 10;
        }
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: fixed; 
            transition: none !important; 
            z-index: 999;
        }
        .form-section {
            display: none;
            margin-top: 10px;
            text-align: left;
            animation: fadeIn 0.5s ease-out;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        /* 🌟 년, 월, 일 리스트를 나란히 예쁘게 배치하는 정렬 스타일 */
        .date-select-group {
            display: flex;
            gap: 8px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        #confirmBtn {
            width: 100%;
            background-color: #008CBA;
            color: white;
            margin-top: 25px;
            padding: 12px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2 id="title">나랑 놀러갈꺼야?</h2>
    
    <div class="btn-group" id="askButtons">
        <button id="yesBtn">YES</button>
        <button id="noBtn" tabindex="-1">NO</button>
    </div>

    <div class="form-section" id="formSection">
        <label>날짜 선택</label>
        <div class="date-select-group">
            <select id="yearSelect"></select>
            <select id="monthSelect"></select>
            <select id="daySelect"></select>
        </div>

        <label for="placeInput">장소 입력</label>
        <input type="text" id="placeInput" placeholder="어디로 갈까?">

        <button id="confirmBtn">Confirm</button>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
        
        // -------------------------------------------------------------
        // ⚠️ [필수] 여기에 본인의 EmailJS 대시보드 값을 정확히 넣어줘!
        // -------------------------------------------------------------
        const EMAILJS_PUBLIC_KEY = "W0oH-T6BDYxPznP4j";   
        const EMAILJS_SERVICE_ID = "service_s2gd9pl";   
        const EMAILJS_TEMPLATE_ID = "template_qdyfh9p"; 
        // -------------------------------------------------------------

        if (EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        }

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const askButtons = document.getElementById('askButtons');
        const formSection = document.getElementById('formSection');
        const yearSelect = document.getElementById('yearSelect');
        const monthSelect = document.getElementById('monthSelect');
        const daySelect = document.getElementById('daySelect');
        const title = document.getElementById('title');
        const confirmBtn = document.getElementById('confirmBtn');

        // 초기 로딩 시 NO 버튼 위치 강제 세팅
        function setInitialNoBtnPosition() {
            const rect = noBtn.getBoundingClientRect();
            noBtn.style.left = rect.left + 'px';
            noBtn.style.top = rect.top + 'px';
        }
        setTimeout(setInitialNoBtnPosition, 100);

        // 📅 [년/월/일] 드롭다운 리스트 동적 생성 함수
        function initYearMonthDay() {
            const today = new Date();
            const currentYear = today.getFullYear();
            
            // 1. 년도 세팅 (올해와 내년까지 선택 가능하게 센스 발휘!)
            for (let y = currentYear; y <= currentYear + 1; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `${y}년`;
                yearSelect.appendChild(opt);
            }
            yearSelect.value = currentYear;

            // 2. 월 세팅 (1월 ~ 12월)
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = `${m}월`;
                monthSelect.appendChild(opt);
            }
            monthSelect.value = today.getMonth() + 1;

            // 3. 일 세팅 함수 (월별로 28일, 30일, 31일이 다르니까 자동으로 계산해 주는 기능 포함)
            function updateDays() {
                // 기존 일 목록 초기화
                daySelect.innerHTML = '';
                
                const selectedYear = parseInt(yearSelect.value);
                const selectedMonth = parseInt(monthSelect.value);
                
                // 선택한 년/월의 마지막 날짜 구하기 (ex: 2월은 28일 혹은 29일)
                const lastDay = new Date(selectedYear, selectedMonth, 0).getDate();

                for (let d = 1; d <= lastDay; d++) {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = `${d}일`;
                    daySelect.appendChild(opt);
                }
            }

            // 년도나 월을 바꿀 때마다 그 달의 일수(28~31일)를 자동으로 새로고침 해줌!
            yearSelect.addEventListener('change', updateDays);
            monthSelect.addEventListener('change', updateDays);
            
            // 최초 1회 오늘 날짜 기준으로 일수 세팅 및 오늘 날짜 선택
            updateDays();
            daySelect.value = today.getDate();
        }
        initYearMonthDay();

        // NO 버튼 화면 전체 순간이동 도망치기 알고리즘
        const proximityRadius = 100;

        window.addEventListener('mousemove', (e) => {
            if (noBtn.style.display === 'none') return;

            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const distance = Math.sqrt(Math.pow(e.clientX - btnCenterX, 2) + Math.pow(e.clientY - btnCenterY, 2));

            if (distance < proximityRadius) {
                const padding = 30;
                const maxX = window.innerWidth - noBtn.clientWidth - padding;
                const maxY = window.innerHeight - noBtn.clientHeight - padding;

                let randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                let randomY = Math.max(padding, Math.floor(Math.random() * maxY));

                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
            }
        });

        noBtn.addEventListener('click', (e) => e.preventDefault());

        yesBtn.addEventListener('click', () => {
            title.textContent = "날짜와 장소를 골라주세요.";
            askButtons.style.display = 'none';
            noBtn.style.display = 'none';
            formSection.style.display = 'block';
        });

        confirmBtn.addEventListener('click', () => {
            // 선택된 년, 월, 일을 결합해서 하나의 예쁜 문자열로 조립해 줘
            const selectedDate = `${yearSelect.value}년 ${monthSelect.value}월 ${daySelect.value}일`;
            const enteredPlace = document.getElementById('placeInput').value.trim();

            if (!enteredPlace) {
                alert('장소를 입력해주세요!');
                return;
            }

            if (EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
                alert("코드 상단에 EmailJS API 키 세팅을 먼저 완료해야 전송이 가능합니다!");
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.textContent = "전송 중...";

            const templateParams = {
                date: selectedDate, // 조합된 'XXXX년 X월 X일' 정보가 EmailJS 템플릿의 {{date}} 변수로 넘어가!
                place: enteredPlace,
                to_email: 'agussstd@outlook.kr' 
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(() => {
                    alert('정보가 성공적으로 전송되었습니다.');
                    confirmBtn.textContent = "전송 완료!";
                }, (error) => {
                    console.error('EmailJS 오류 상세 정보:', error);
                    alert('전송 실패!');
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = "Confirm";
                });
        });
    });
</script>
</body>
</html>
