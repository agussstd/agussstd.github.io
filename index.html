<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join with me!</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            width: 360px;
            min-height: 220px;
            box-sizing: border-box;
        }
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            transition: none; /* 순간이동 모드 */
        }
        .form-section {
            display: none;
            margin-top: 10px;
            text-align: left;
            animation: fadeIn 0.5s ease-out;
        }
        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        #confirmBtn {
            width: 100%;
            background-color: #008CBA;
            color: white;
            margin-top: 25px;
            padding: 12px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2 id="title">Join with me! 😊</h2>
    
    <div class="btn-group" id="askButtons">
        <button id="yesBtn">YES</button>
        <button id="noBtn" tabindex="-1">NO</button>
    </div>

    <div class="form-section" id="formSection">
        <label for="dateSelect">날짜 선택</label>
        <select id="dateSelect"></select>

        <label for="placeInput">장소 입력</label>
        <input type="text" id="placeInput" placeholder="어디로 갈까?">

        <button id="confirmBtn">Confirm</button>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
        
        // -------------------------------------------------------------
        // ⚠️ [필수 설정] 여기에 본인의 EmailJS 대시보드 값을 정확히 입력해줘!
        // -------------------------------------------------------------
        const EMAILJS_PUBLIC_KEY = "W0oH-T6BDYxPznP4j";   // 대시보드 Account -> API Keys에 있는 값
        const EMAILJS_SERVICE_ID = "service_s2gd9pl";   // Email Services 탭에 있는 서비스 ID
        const EMAILJS_TEMPLATE_ID = "template_qdyfh9p"; // Email Templates 탭에 있는 템플릿 ID
        // -------------------------------------------------------------

        // 대시보드 소스 코드가 정상적으로 채워졌을 때만 초기화 진행
        if (EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        } else {
            console.warn("EmailJS Public Key가 설정되지 않았습니다.");
        }

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const askButtons = document.getElementById('askButtons');
        const formSection = document.getElementById('formSection');
        const dateSelect = document.getElementById('dateSelect');
        const title = document.getElementById('title');
        const confirmBtn = document.getElementById('confirmBtn');

        // 오늘 날짜 기준으로 30일치 선택지 동적 생성 (월/일 포맷)
        function initDates() {
            const today = new Date();
            for (let i = 0; i < 30; i++) {
                const nextDate = new Date(today);
                nextDate.setDate(today.getDate() + i);
                const month = nextDate.getMonth() + 1;
                const date = nextDate.getDate();
                const optionText = `${month}월 ${date}일`;
                
                const option = document.createElement('option');
                option.value = optionText;
                option.textContent = optionText;
                dateSelect.appendChild(option);
            }
        }
        initDates();

        // NO 버튼 근접 감지 도망치기 알고리즘 (80px 반경 진입 시 작동)
        const proximityRadius = 80;

        window.addEventListener('mousemove', (e) => {
            if (noBtn.style.display === 'none') return;

            const container = document.getElementById('mainContainer');
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const distance = Math.sqrt(Math.pow(e.clientX - btnCenterX, 2) + Math.pow(e.clientY - btnCenterY, 2));

            if (distance < proximityRadius) {
                const padding = 20;
                const maxX = container.clientWidth - noBtn.clientWidth - padding;
                const maxY = container.clientHeight - noBtn.clientHeight - padding;

                let randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                let randomY = Math.max(60, Math.floor(Math.random() * maxY));

                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
            }
        });

        noBtn.addEventListener('click', (e) => e.preventDefault());

        // YES 버튼 클릭 시 입력 폼으로 화면 전환
        yesBtn.addEventListener('click', () => {
            title.textContent = "날짜와 장소를 골라줘! 🚀";
            askButtons.style.display = 'none';
            noBtn.style.display = 'none';
            formSection.style.display = 'block';
        });

        // Confirm 클릭 시 이메일 즉시 비동기 전송 (외부 페이지/이슈 팝업 없음)
        confirmBtn.addEventListener('click', () => {
            const selectedDate = dateSelect.value;
            const enteredPlace = document.getElementById('placeInput').value.trim();

            if (!enteredPlace) {
                alert('장소를 입력해주세요!');
                return;
            }

            if (EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
                alert("코드 상단에 EmailJS API 키 설정을 먼저 완료해야 전송이 가능합니다!");
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.textContent = "전송 중...";

            // EmailJS로 전달될 파라미터 매핑
            const templateParams = {
                date: selectedDate,
                place: enteredPlace,
                to_email: 'agussstd@outlook.kr' 
            };

            // EmailJS API 호출
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(() => {
                    alert('🎉 약속 정보가 성공적으로 전송되었습니다!');
                    confirmBtn.textContent = "전송 완료!";
                }, (error) => {
                    console.error('EmailJS 오류 상세 정보:', error);
                    alert('전송 실패! API 설정을 다시 한번 확인하세요.');
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = "Confirm";
                });
        });
    });
</script>
</body>
</html>
